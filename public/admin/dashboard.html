<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel de Libretas - ISP</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
    tailwind.config = { theme: { extend: { colors: { brand: {
        50:'#eff6ff',100:'#dbeafe',500:'#00b4a8',600:'#00a8a0',700:'#00857f'
    }}, fontFamily: { sans: ['Montserrat','system-ui','sans-serif'] } } } }
</script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
<style>
  body { font-family: 'Montserrat', system-ui, sans-serif; background: #F4F6F9; }
  .sheet-wrap-inline { max-width: 460px; margin: 0 auto; }
</style>
</head>
<body class="antialiased">
  <header class="bg-[#1E2D44] text-white sticky top-0 z-40 shadow-md">
    <div class="max-w-6xl mx-auto px-5 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <img src="../img/logo-mark-white.png" class="w-8 h-8 object-contain" alt="ISP">
        <div>
          <div class="text-sm font-bold leading-tight">Panel de Libretas</div>
          <div class="text-[11px] text-white/60 leading-tight">ISP · Infraestructura y Servicios Portuarios</div>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button id="llenarLibretaBtn" class="flex items-center gap-2 text-xs font-bold bg-[#00b4a8] hover:bg-[#00a8a0] rounded-full px-4 py-2 transition">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></svg>
          Llenar libreta
        </button>
        <button id="logoutBtn" class="flex items-center gap-2 text-xs font-semibold bg-white/10 hover:bg-white/20 border border-white/25 rounded-full px-4 py-2 transition">
          Cerrar sesión
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-5 py-6">
    <div class="flex gap-2 flex-wrap mb-5">
      <button class="tab-btn active px-5 py-2.5 rounded-full text-xs font-bold border-2 transition" data-tipo="art">ART</button>
      <button class="tab-btn px-5 py-2.5 rounded-full text-xs font-bold border-2 transition" data-tipo="stop-work">STOP WORK</button>
      <button class="tab-btn px-5 py-2.5 rounded-full text-xs font-bold border-2 transition" data-tipo="nmha">NMHA</button>
    </div>

    <div class="flex gap-2 flex-wrap mb-5 items-center bg-white border border-gray-200 rounded-2xl p-3 shadow-sm">
      <label class="text-xs font-semibold text-gray-500 pl-1">Desde</label>
      <input type="date" id="filtroDesde" class="px-3 py-2 rounded-lg border border-gray-200 text-sm font-medium">
      <label class="text-xs font-semibold text-gray-500 pl-1">Hasta</label>
      <input type="date" id="filtroHasta" class="px-3 py-2 rounded-lg border border-gray-200 text-sm font-medium">
      <button id="filtrarBtn" class="px-4 py-2 rounded-lg bg-[#1E2D44] text-white text-xs font-bold hover:bg-[#253649] transition">Filtrar</button>
      <button id="exportBtn" class="flex items-center gap-2 px-4 py-2 rounded-lg bg-[#00857f] text-white text-xs font-bold hover:bg-[#00716c] transition">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Descargar Excel (ART + Stop Work + NMHA)
      </button>
      <span id="resultCount" class="ml-auto text-xs font-semibold text-gray-400"></span>
    </div>

    <div id="listContainer" class="grid gap-3 sm:grid-cols-2 xl:grid-cols-3"></div>
  </main>

  <div class="detail-overlay" id="detailOverlay">
    <div class="detail-sheet" id="detailSheet"></div>
  </div>

  <style>
    .tab-btn { background: #fff; border-color: #E3E8EF; color: #5A6B82; }
    .tab-btn.active { background: #1E2D44; border-color: #1E2D44; color: #fff; }
  </style>

  <script src="../js/viewer.js"></script>
  <script src="../js/acciones-historial.js"></script>
  <script src="../js/admin-dashboard.js"></script>
</body>
</html>
