<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel de Libretas - ISP</title>
<link rel="icon" type="image/png" sizes="32x32" href="../img/icono-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="../img/icono-192.png">
<link rel="apple-touch-icon" href="../img/icono-180.png">
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/admin.css">
<style>
  body { font-family: 'Montserrat', system-ui, sans-serif; background: #F4F6F9; }
  .sheet-wrap-inline { max-width: 460px; margin: 0 auto; }
  .tab-btn { background: #fff; border-color: #E3E8EF; color: #5A6B82; }
  .tab-btn.active { background: #1E2D44; border-color: #1E2D44; color: #fff; }
</style>
</head>
<body class="antialiased adm">
  <!-- Menú lateral (computadora) -->
  <aside class="adm-side">
    <div class="adm-brand">
      <img src="../img/logoisp-bola-96.png" alt="ISP">
      <div>
        <div class="adm-brand-t">Panel de Libretas</div>
        <div class="adm-brand-s">ISP · Seguridad e Higiene</div>
      </div>
    </div>
    <nav class="adm-nav">
      <a href="#dashboard" data-vista="dashboard">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 13h6V4H4v9zm10 7h6V11h-6v9zM4 20h6v-4H4v4zm10-16v4h6V4h-6z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <span>Dashboard</span>
      </a>
      <a href="#registros" data-vista="registros">
        <svg viewBox="0 0 24 24" fill="none"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Registros</span>
      </a>
      <a href="#acciones" data-vista="acciones">
        <svg viewBox="0 0 24 24" fill="none"><path d="M9 11l3 3 8-8M20 12v7a1 1 0 01-1 1H5a1 1 0 01-1-1V5a1 1 0 011-1h11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Acciones</span><b class="adm-badge" data-badge="revision"></b>
      </a>
      <a href="#mis-acciones" data-vista="mis-acciones" class="adm-oculto">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 12a4 4 0 100-8 4 4 0 000 8zM4 20a8 8 0 0116 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>Mis acciones</span><b class="adm-badge" data-badge="mias"></b>
      </a>
    </nav>
    <div class="adm-side-bottom">
      <div class="adm-usuario" id="admUsuario"></div>
      <button type="button" class="adm-btn-llenar" data-accion="llenar">+ Llenar libreta</button>
      <button type="button" class="adm-btn-salir" data-accion="salir">Cerrar sesión</button>
    </div>
  </aside>

  <!-- Encabezado (celular) -->
  <header class="adm-top">
    <img src="../img/logoisp-bola-96.png" alt="ISP">
    <div class="adm-top-t" id="admTituloMovil">Dashboard</div>
    <button type="button" class="adm-top-btn llenar" data-accion="llenar" aria-label="Llenar libreta">+ Llenar</button>
    <button type="button" class="adm-top-btn" data-accion="salir">Salir</button>
  </header>

  <main class="adm-main">
    <section class="adm-vista" id="vista-dashboard">
      <h1 class="adm-h1">Dashboard</h1>
      <section id="resumen"><div class="rs-vacio">Cargando resumen…</div></section>
    </section>

    <section class="adm-vista" id="vista-registros">
      <h1 class="adm-h1">Registros</h1>
      <div class="flex gap-2 flex-wrap mb-4">
        <button class="tab-btn active px-5 py-2.5 rounded-full text-xs font-bold border-2 transition" data-tipo="art">ART</button>
        <button class="tab-btn px-5 py-2.5 rounded-full text-xs font-bold border-2 transition" data-tipo="stop-work">STOP WORK</button>
        <button class="tab-btn px-5 py-2.5 rounded-full text-xs font-bold border-2 transition" data-tipo="nmha">NMHA</button>
      </div>
      <div class="adm-filtros">
        <input type="search" id="buscarRegistros" class="adm-buscar" placeholder="Buscar por nombre, área, tarea…">
        <label>Desde <input type="date" id="filtroDesde"></label>
        <label>Hasta <input type="date" id="filtroHasta"></label>
        <button id="filtrarBtn" class="adm-btn-osc">Filtrar</button>
        <button id="exportBtn" class="adm-btn-excel">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Excel (ART + Stop Work + NMHA)
        </button>
        <span id="resultCount" class="adm-conteo"></span>
      </div>
      <div id="listContainer" class="adm-lista"></div>
      <button type="button" class="adm-mas" id="verMasRegistros" hidden>Ver más</button>
    </section>

    <section class="adm-vista" id="vista-acciones">
      <h1 class="adm-h1">Acciones</h1>
      <div class="adm-chips" id="chipsEstado">
        <button type="button" data-estado="en_revision">En revisión <b></b></button>
        <button type="button" data-estado="pendientes">Por realizar <b></b></button>
        <button type="button" data-estado="cerradas">Cerradas <b></b></button>
        <button type="button" data-estado="">Todas <b></b></button>
      </div>
      <div class="adm-filtros">
        <input type="search" id="buscarAcciones" class="adm-buscar" placeholder="Buscar acción, responsable, área…">
        <select id="filtroResponsable" class="adm-select"><option value="">Todos los responsables</option></select>
        <span id="accionesCount" class="adm-conteo"></span>
      </div>
      <div id="accionesLista" class="adm-lista"></div>
      <button type="button" class="adm-mas" id="verMasAcciones" hidden>Ver más</button>
    </section>

    <section class="adm-vista" id="vista-mis-acciones">
      <h1 class="adm-h1">Mis acciones</h1>
      <p class="adm-sub">Acciones del NMHA que te asignaron. Tú misma las cierras.</p>
      <div id="misAccionesLista" class="sheet-wrap-inline"></div>
    </section>
  </main>

  <!-- Barra inferior (celular) -->
  <nav class="adm-bottom">
    <a href="#dashboard" data-vista="dashboard">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 13h6V4H4v9zm10 7h6V11h-6v9zM4 20h6v-4H4v4zm10-16v4h6V4h-6z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span>Dashboard</span>
    </a>
    <a href="#registros" data-vista="registros">
      <svg viewBox="0 0 24 24" fill="none"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Registros</span>
    </a>
    <a href="#acciones" data-vista="acciones">
      <svg viewBox="0 0 24 24" fill="none"><path d="M9 11l3 3 8-8M20 12v7a1 1 0 01-1 1H5a1 1 0 01-1-1V5a1 1 0 011-1h11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Acciones</span><b class="adm-badge" data-badge="revision"></b>
    </a>
    <a href="#mis-acciones" data-vista="mis-acciones" class="adm-oculto">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 12a4 4 0 100-8 4 4 0 000 8zM4 20a8 8 0 0116 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Mías</span><b class="adm-badge" data-badge="mias"></b>
    </a>
  </nav>

  <div class="detail-overlay" id="detailOverlay">
    <div class="detail-sheet" id="detailSheet"></div>
  </div>

  <script src="../js/viewer.js"></script>
  <script src="../js/acciones-historial.js"></script>
  <script src="../js/fotos.js"></script>
  <script src="../js/admin-resumen.js"></script>
  <script src="../js/admin-dashboard.js"></script>
</body>
</html>
