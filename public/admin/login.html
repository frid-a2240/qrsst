<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libreta de Herramientas - ISP</title>
    <link rel="icon" type="image/png" sizes="32x32" href="../img/icono-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="../img/icono-192.png">
    <link rel="apple-touch-icon" href="../img/icono-180.png">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="font-sans antialiased bg-slate-100 h-screen overflow-hidden">
    <div class="h-full flex">
        
        <div class="hidden lg:flex lg:w-1/2 items-center justify-center bg-[#1E2D44] overflow-hidden">
            <img src="../img/portada.jpg" alt="" class="w-full h-full object-contain">
        </div>

        <div class="flex-1 flex items-center justify-center p-8 lg:p-24 bg-white overflow-y-auto">
            <div class="w-full max-w-md">

                <div class="mb-10 border-b pb-6 text-center">
                    <img src="../img/logo-mark.png" class="w-14 h-14 object-contain mb-3 mx-auto" alt="ISP">
                    <div class="text-sm font-bold text-[#1E2D44]">Infraestructura y Servicios Portuarios</div>
                    <div class="text-3xl font-extrabold text-[#00857f]">Panel de Libretas</div>
                </div>

                <div class="mb-8">
                    <h2 class="text-2xl font-bold text-[#1E2D44] mb-2">Iniciar sesión</h2>
                    <p class="text-sm text-gray-500">Ingresa tus credenciales para ver las libretas registradas</p>
                </div>

                <form id="loginForm" class="space-y-5">
                    <div>
                        <label class="text-sm font-semibold text-gray-700">Número de control</label>
                        <input id="inp-numero-control" name="numero_control" type="text" inputmode="numeric" placeholder="Ej. 12345" autocomplete="username" required
                            oninput="clearMsgs()"
                            class="w-full mt-2 px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-[#00b4a8]/25 focus:border-[#00b4a8]">
                    </div>
                    <div>
                        <label class="text-sm font-semibold text-gray-700">Contraseña</label>
                        <div class="relative mt-2">
                            <input id="inp-pass" name="password" type="password" placeholder="Tu contraseña" autocomplete="current-password" required
                                oninput="clearMsgs()"
                                class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-[#00b4a8]/25 focus:border-[#00b4a8]">
                            <button type="button" onclick="togglePw()" aria-label="Mostrar contraseña"
                                class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400">
                                <svg id="ojo" width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/></svg>
                            </button>
                        </div>
                    </div>

                    <div id="login-err" class="hidden text-sm text-red-600 bg-red-50 border border-red-200 rounded-lg p-3 flex items-center gap-2">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" class="shrink-0"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M12 7.5v5.5M12 16.5v.01" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
                        <span id="login-err-text"></span>
                    </div>

                    <button id="btn-login" type="submit"
                        class="w-full py-3 bg-[#1E2D44] hover:bg-[#253649] disabled:bg-gray-300 disabled:cursor-not-allowed text-white rounded-xl font-semibold transition flex items-center justify-center gap-2">
                        <span id="btn-label">Ingresar</span>
                        <svg id="btn-loader" class="hidden animate-spin" width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-opacity=".3" stroke-width="3"/><path d="M21 12a9 9 0 00-9-9" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script src="../js/admin-login.js"></script>
</body>
</html>
