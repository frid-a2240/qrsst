<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Libreta de Herramientas ISP</title>
<link rel="icon" type="image/png" sizes="32x32" href="img/icono-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="img/icono-192.png">
<link rel="apple-touch-icon" href="img/icono-180.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="page">
    <div class="flex items-center justify-between" style="display:flex; align-items:center; justify-content:space-between;">
      <a class="back-link" href="index.html">&larr; Volver</a>
      <button type="button" id="logoutBtn" style="border:none; background:none; color:var(--text-muted); font-family:var(--font-head); font-weight:700; font-size:13px; cursor:pointer;">Cerrar sesión</button>
    </div>
    <a href="mis-acciones.html" id="misAccionesBtn" class="mis-acciones-btn" style="display:none;">
      <span>
        <b>Mis acciones asignadas</b>
        <small id="misAccionesTexto"></small>
      </span>
      <span class="mis-acciones-count" id="misAccionesCount"></span>
    </a>

    <h1>¿Qué libreta vas a llenar?</h1>

    <div class="sheet menu-cover">
      <img class="bg" src="img/hojas/portada-menu.jpg" alt="Libreta de Herramientas — ART, Stop Work Authority, NMHA">
      <a class="menu-hotspot" href="art.html" aria-label="Llenar ART" style="top:54.5%; height:14.8%;"></a>
      <a class="menu-hotspot" href="stop-work.html" aria-label="Llenar Stop Work Authority" style="top:69.3%; height:16.1%;"></a>
      <a class="menu-hotspot" href="nmha.html" aria-label="Llenar NMHA" style="top:85.4%; height:14.6%;"></a>
    </div>
  </div>

  <style>
    .menu-hotspot {
      position: absolute;
      left: 0;
      width: 100%;
      display: block;
      transition: background 0.15s ease;
    }
    .menu-hotspot:hover, .menu-hotspot:active { background: rgba(255,255,255,0.12); }
    .mis-acciones-btn {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      margin: 10px 0 4px; padding: 14px 16px; border-radius: 14px;
      background: var(--navy); color: #fff; text-decoration: none;
      box-shadow: var(--shadow);
    }
    .mis-acciones-btn b { display: block; font-family: var(--font-head); font-size: 15px; }
    .mis-acciones-btn small { display: block; font-size: 12.5px; opacity: .8; margin-top: 2px; font-weight: 600; }
    .mis-acciones-count {
      flex: none; min-width: 34px; height: 34px; padding: 0 10px; border-radius: 999px;
      background: var(--red); color: #fff; font-weight: 800; font-size: 15px;
      display: flex; align-items: center; justify-content: center;
    }
    .mis-acciones-count.cero { background: rgba(255,255,255,0.18); }
  </style>

  <script src="js/require-colaborador.js"></script>
  <script>
    // En la app se pinta con la sesión guardada y se repinta cuando contesta el servidor.
    window.colaboradorListo.then(pintarMisAcciones);
    document.addEventListener('colaborador-actualizado', (e) => pintarMisAcciones(e.detail));
    function pintarMisAcciones(c) {
      if (!c || !c.es_responsable) return;
      const n = c.acciones_pendientes;
      document.getElementById('misAccionesTexto').textContent = n
        ? `Tienes ${n} acci${n === 1 ? 'ón pendiente' : 'ones pendientes'} por realizar`
        : 'No tienes acciones pendientes';
      const count = document.getElementById('misAccionesCount');
      count.textContent = n;
      count.classList.toggle('cero', !n);
      document.getElementById('misAccionesBtn').style.display = 'flex';
    }
  </script>
  <script>
    const logoutBtn = document.getElementById('logoutBtn');
    if (window.modoAdmin) {
      logoutBtn.textContent = 'Volver al panel';
      document.querySelector('.back-link').href = 'admin/dashboard.html';
      document.querySelector('h1').textContent = '¿Qué libreta vas a capturar?';
    }
    logoutBtn.addEventListener('click', async () => {
      if (window.modoAdmin) {
        try { sessionStorage.removeItem('isp_modo_admin'); } catch {}
        window.location.href = 'admin/dashboard.html';
        return;
      }
      try { await fetch('api/colaborador-logout', { method: 'POST' }); } catch {}
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
