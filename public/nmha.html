<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>NMHA - Libreta de Herramientas ISP</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="successScreen" class="success-screen" style="display:none;">
    <div class="success-icon">✓</div>
    <h1>Alerta enviada</h1>
    <p>Gracias por ayudarnos a hacer del lugar de trabajo un sitio más seguro.</p>
    <a class="btn-role primary" style="margin-top:20px; max-width:220px;" href="colaborador.html">Llenar otra libreta</a>
  </div>

  <div class="sheet-wrap" id="formScreen">
    <div class="sheet-topbar">
      <a class="back-link" href="colaborador.html">&larr; Volver</a>
      <div style="display:flex; align-items:center; gap:8px;">
        <button type="button" id="openRefGuideBtn" style="padding:6px 12px; border-radius:999px; border:2px solid var(--border); background:#fff; font-family:var(--font-head); font-weight:700; font-size:12.5px; color:var(--navy); cursor:pointer;">📖 Ver guía</button>
        <span class="step-pill" id="stepPill">Hoja 1 de 2</span>
      </div>
    </div>

    <form id="nmhaForm">
      <!-- STEP 1 -->
      <div id="step1">
        <div class="sheet">
          <img class="bg" src="img/hojas/nmha-1.jpg" alt="NMHA hoja 1">

          <button type="button" class="chkbox teal" data-cbgroup="tipo" data-value="acto_inseguro" style="left:51.65%; top:21.22%; width:4.8%; height:3.32%;">
            <span class="mark"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12l6 6L20 6" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          </button>
          <button type="button" class="chkbox teal" data-cbgroup="tipo" data-value="condicion_insegura" style="left:73.57%; top:21.22%; width:4.89%; height:3.32%;">
            <span class="mark"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12l6 6L20 6" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          </button>
          <button type="button" class="chkbox teal" data-cbgroup="tipo" data-value="casi_incidente" style="left:51.65%; top:25.91%; width:4.8%; height:3.32%;">
            <span class="mark"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12l6 6L20 6" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          </button>
          <button type="button" class="chkbox teal" data-cbgroup="tipo" data-value="mejora" style="left:73.57%; top:25.91%; width:4.89%; height:3.32%;">
            <span class="mark"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12l6 6L20 6" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          </button>

          <div class="f" style="left:15.24%; top:22.16%; width:33.11%; height:3.3%;">
            <input type="date" name="fecha" required>
          </div>
          <div class="f" style="left:28.22%; top:31.6%; width:66.32%; height:3.3%;">
            <div class="viewer-text" id="reportadoPorDisplay"></div>
            <input type="hidden" name="reportado_por">
          </div>
          <div class="f" style="left:33.58%; top:37.13%; width:60.87%; height:3.3%;">
            <input type="text" spellcheck="false" name="centro_trabajo" required>
          </div>
          <div class="f" style="left:28.5%; top:42.73%; width:65.95%; height:3.3%;">
            <input type="text" spellcheck="false" name="area_especifica" required>
          </div>
          <div class="f" style="left:7.46%; top:52.31%; width:85.09%; height:16.35%;">
            <textarea spellcheck="false" name="descripcion" required></textarea>
          </div>

          <div id="esencialesContainer"></div>
        </div>

        <div class="sheet-actions">
          <button type="button" class="btn-next" id="toStep2">Siguiente hoja &rarr;</button>
        </div>
      </div>

      <!-- STEP 2 -->
      <div id="step2" style="display:none;">
        <div class="sheet">
          <img class="bg" src="img/hojas/nmha-2.jpg" alt="NMHA hoja 2">

          <div class="f" style="left:7.17%; top:24.96%; width:84.99%; height:18.83%;">
            <textarea spellcheck="false" name="acciones_inmediatas"></textarea>
          </div>

          <button type="button" class="chkbox teal" data-group="requiere" data-value="si" style="left:73.47%; top:47.07%; width:5.74%; height:3.97%;">
            <span class="mark"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12l6 6L20 6" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          </button>
          <button type="button" class="chkbox red" data-group="requiere" data-value="no" style="left:81.28%; top:47.14%; width:5.83%; height:3.97%;">
            <span class="mark"><svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/></svg></span>
          </button>

          <div class="f" style="left:7.55%; top:57.06%; width:85.09%; height:22.15%;">
            <textarea spellcheck="false" name="acciones_sugeridas"></textarea>
          </div>
        </div>

        <div class="sheet-actions">
          <button type="button" class="btn-prev" id="toStep1">&larr; Regresar</button>
          <button type="submit" class="btn-submit" id="submitBtn">Enviar alerta</button>
        </div>
        <div id="errorBox" class="error-box"></div>
      </div>
    </form>
  </div>

  <script src="js/reference-viewer.js"></script>
  <script src="js/require-colaborador.js"></script>
  <script src="js/nmha.js"></script>
</body>
</html>
