<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Stop Work Authority - Libreta de Herramientas ISP</title>
<link rel="icon" type="image/png" sizes="32x32" href="img/icono-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="img/icono-192.png">
<link rel="apple-touch-icon" href="img/icono-180.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="successScreen" class="success-screen" style="display:none;">
    <div class="success-icon">✓</div>
    <h1>Registro enviado</h1>
    <p>Gracias por cuidarte y cuidar a los demás.</p>
    <a class="btn-role primary" style="margin-top:20px; max-width:220px;" href="colaborador.html">Llenar otra libreta</a>
  </div>
  <div class="sheet-wrap" id="formScreen">
    <div class="sheet-topbar">
      <a class="back-link" href="colaborador.html">&larr; Volver</a>
      <button type="button" id="openRefGuideBtn" style="padding:9px 16px; border-radius:999px; border:2px solid var(--border); background:#fff; font-family:var(--font-head); font-weight:700; font-size:12.5px; color:var(--navy); cursor:pointer;">📖 Ver guía</button>
    </div>

    <form id="stopForm">
      <div class="sheet">
        <img class="bg" src="img/hojas/stop-work-1.jpg" alt="Stop Work Authority">

        <div class="f" style="left:14.39%; top:28.29%; width:33.11%; height:6%;">
          <input type="date" name="fecha" required>
        </div>

        <button type="button" class="chkbox teal" data-group="tipo_persona" data-value="empleado" style="left:51.18%; top:29.61%; width:4.52%; height:6.1%;">
          <span class="mark"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12l6 6L20 6" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        </button>
        <button type="button" class="chkbox teal" data-group="tipo_persona" data-value="contratista" style="left:73%; top:29.48%; width:4.52%; height:6.23%;">
          <span class="mark"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12l6 6L20 6" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        </button>

        <div class="f" style="left:41.67%; top:37.9%; width:52.96%; height:6%;">
          <input type="text" spellcheck="false" name="nombre_companero">
        </div>

        <button type="button" class="chkbox teal" data-group="quien_empezo" data-value="yo" style="left:5.83%; top:56.36%; width:4.42%; height:6.23%;">
          <span class="mark"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12l6 6L20 6" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        </button>
        <button type="button" class="chkbox teal" data-group="quien_empezo" data-value="companero" style="left:16.56%; top:56.36%; width:4.52%; height:6.23%;">
          <span class="mark"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12l6 6L20 6" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        </button>

        <div class="f" style="left:6.99%; top:70.42%; width:85.09%; height:25.99%;">
          <textarea spellcheck="false" name="descripcion" required></textarea>
        </div>
      </div>

      <div class="sheet-actions">
        <label style="font-family:var(--font-head); font-weight:700; font-size:13px; color:var(--navy); display:block; margin-bottom:6px;">Tu nombre</label>
        <div class="readonly-field" id="nombreDisplay" style="margin-bottom:4px;"></div>
        <input type="hidden" name="nombre_colaborador">
        <button type="submit" class="btn-submit stop-color" id="submitBtn">Enviar registro</button>
      </div>
      <div id="errorBox" class="error-box"></div>
    </form>
  </div>

  <script src="js/reference-viewer.js"></script>
  <script src="js/require-colaborador.js"></script>
  <script src="js/stop-work.js"></script>
</body>
</html>
